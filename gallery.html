<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your photos — Shivay Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Your photos are ready — Shivay Studio">
<meta property="og:image" content="/og-image.jpg">
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--mute:#6e6e73;--card:#fff;--line:#d2d2d7;--blue:#0071e3}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mute:#a1a1a6;--card:#1c1c1e;--line:#3a3a3c;--blue:#2997ff}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.47;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 max(16px,calc(50% - 560px));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:-.02em;color:var(--fg);text-decoration:none}
.brand img{width:28px;height:28px}
.btn{display:inline-block;padding:9px 18px;border-radius:980px;background:var(--blue);color:#fff;text-decoration:none;font-size:15px;border:0;cursor:pointer}
header{text-align:center;padding:64px 16px 32px}
header p{color:var(--mute);font-size:17px}
h1{font-size:clamp(34px,6vw,56px);font-weight:700;letter-spacing:-.035em;line-height:1.08;margin:6px 0 8px}
.tag{display:inline-block;padding:4px 12px;border-radius:980px;font-size:13px;font-weight:600;background:#30a14e22;color:#30a14e}
.tag.w{background:#f59e0b22;color:#d97706}
main{max-width:1120px;margin:auto;padding:0 16px 64px;columns:3 260px;column-gap:12px}
.ph{break-inside:avoid;margin-bottom:12px;border-radius:18px;overflow:hidden;cursor:zoom-in;border:0;padding:0;width:100%;display:block;background:linear-gradient(135deg,#5e5ce6,#0a84ff)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.empty{columns:auto;text-align:center;color:var(--mute);padding:40px 16px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:24px 16px 40px;border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.ov img{max-width:94vw;max-height:86vh;border-radius:12px}
.ov button{position:absolute;background:none;border:0;color:#fff;cursor:pointer}
.ov .x{top:14px;right:18px;font-size:34px}.ov .nv{top:50%;transform:translateY(-50%);font-size:46px;padding:12px}
</style>
</head>
<body>
<nav><a class="brand" href="/"><img src="/logo.svg" alt="">Shivay Studio</a><a class="btn" id="wa" target="_blank" rel="noopener">WhatsApp us</a></nav>
<header><p id="type"></p><h1 id="name">Your photos</h1><span class="tag" id="status"></span></header>
<main id="grid"></main>
<footer>Shared privately by Shivay Studio, Ranivara · Demo gallery with sample photos</footer>
<div id="layer"></div>
<script>
(function(){
var U=function(id,w){return 'https://images.unsplash.com/'+id+'?auto=format&fit=crop&w='+w+'&q=72'};
/* sample photos per shoot type (demo) */
var SETS={
 'Wedding':['photo-1519741497674-611481863552','photo-1511285560929-80b456fea0bc','photo-1520854221256-17451cc331bf','photo-1583939003579-730e3918a45a'],
 'Pre-wedding':['photo-1522673607200-164d1b6ce486','photo-1469474968028-56623f02e42e','photo-1506905925346-21bda4d32df4','photo-1520854221256-17451cc331bf'],
 'Portrait':['photo-1438761681033-6461ffad8d80','photo-1494790108377-be9c29b29330','photo-1507003211169-0a1dd7228f2d'],
 'Product / Business':['photo-1523275335684-37898b6baf30','photo-1505740420928-5e560c06d30e','photo-1452587925148-ce544e77e70d'],
 'Birthday / Event':['photo-1492684223066-81342ee5ff30','photo-1519741497674-611481863552','photo-1511285560929-80b456fea0bc'],
 'Film / Ad':['photo-1485846234645-a62644f84728','photo-1516035069371-29a1b244cc32','photo-1473968512647-3e447244af8f']
};
var q=new URLSearchParams(location.search),$=function(s){return document.querySelector(s)};
var name=q.get('c')||'Your photos',type=q.get('t')||'Wedding',status=q.get('s')||'Delivered';
var set=SETS[type]||SETS['Wedding'],ready=status==='Delivered'||status==='Editing';
document.title=name+' — Shivay Studio';
$('#name').textContent=name;$('#type').textContent=type;
$('#status').textContent=status==='Delivered'?'Final photos':status==='Editing'?'Proofs — editing in progress':'Photos coming soon';
if(status!=='Delivered')$('#status').className='tag w';
$('#wa').href='https://wa.me/918302615834?text='+encodeURIComponent('Hello Shivay Studio, about my gallery ('+name+')');
var list=[];if(ready){for(var i=0;i<12;i++)list.push(set[i%set.length])}
var H=[300,220,340,260,240,320];
var grid=$('#grid');
if(!list.length){grid.className='empty';grid.textContent='Your photos are being prepared. We will send you this same link when they are ready.'}
else grid.innerHTML=list.map(function(id,i){return '<button class="ph" data-i="'+i+'" style="height:'+H[i%H.length]+'px" aria-label="Photo '+(i+1)+'"><img src="'+U(id,800)+'" alt="Photo '+(i+1)+'" loading="lazy" onerror="this.remove()"></button>'}).join('');
var pos=0;
function draw(){$('#layer').innerHTML='<div class="ov" data-close><button class="x" data-close aria-label="Close">×</button><button class="nv" style="left:6px" data-nav="-1" aria-label="Previous">‹</button><img src="'+U(list[pos],1800)+'" alt="Photo '+(pos+1)+'"><button class="nv" style="right:6px" data-nav="1" aria-label="Next">›</button></div>'}
document.addEventListener('click',function(e){
 var p=e.target.closest('.ph');if(p){pos=+p.getAttribute('data-i');draw();return}
 var n=e.target.getAttribute('data-nav');if(n){pos=(pos+ +n+list.length)%list.length;draw();return}
 if(e.target.hasAttribute('data-close'))$('#layer').innerHTML='';
});
document.addEventListener('keydown',function(e){if(!$('#layer').innerHTML)return;if(e.key==='Escape')$('#layer').innerHTML='';if(e.key==='ArrowRight'||e.key==='ArrowLeft'){pos=(pos+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;draw()}});
})();
</script>
</body>
</html>
