<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio Login — Shivay Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--mute:#6e6e73;--card:#fff;--line:#d2d2d7;--blue:#0071e3;--soft:#f5f5f7;--ok:#30a14e;--warn:#f59e0b;--bad:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mute:#a1a1a6;--card:#1c1c1e;--line:#3a3a3c;--blue:#2997ff;--soft:#161618}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.47;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hide{display:none!important}
.btn{display:inline-block;padding:12px 24px;border-radius:980px;background:var(--blue);color:#fff;text-decoration:none;font-size:17px;border:0;cursor:pointer}
.btn.o{background:none;color:var(--blue);border:1px solid var(--blue)}
.btn.sm{padding:7px 16px;font-size:14px}
.btn.g{background:var(--soft);color:var(--fg)}
.btn.r{background:none;color:var(--bad);border:1px solid var(--line)}
.in{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:16px}
.in:focus{outline:2px solid var(--blue);border-color:transparent}
.logo{width:28px;height:28px;flex:none}
/* ---------- login screen ---------- */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 110%,rgba(10,132,255,.22),transparent 60%),radial-gradient(ellipse at 15% 0,rgba(191,90,242,.16),transparent 50%),var(--soft)}
#auth .modal{box-shadow:0 30px 80px rgba(0,0,0,.12)}
#auth .icon{width:72px;height:72px;display:block;margin:0 auto 18px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#auth h3,#auth .mute.c{text-align:center}
#auth .back{display:block;text-align:center;margin-top:16px;font-size:14px;text-decoration:none}
/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:28px;padding:32px;width:min(420px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.modal h3{font-size:26px;letter-spacing:-.02em}
.modal .mute{color:var(--mute);font-size:15px;margin:4px 0 18px}
.modal .in{margin-bottom:10px}
.modal .btn{width:100%;text-align:center}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:14px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:12px 22px;border-radius:980px;font-size:15px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* ---------- dashboard ---------- */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;background:var(--soft)}
aside{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;padding:6px 12px 18px;letter-spacing:-.02em}
aside a.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--fg);text-decoration:none;font-size:15px;cursor:pointer}
aside a.nv:hover{background:var(--soft)}aside a.nv.on{background:var(--blue);color:#fff}
aside .sp{flex:1}
main.d{padding:28px clamp(16px,3vw,40px) 60px;max-width:1200px;width:100%}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.dh h2{font-size:34px;letter-spacing:-.03em}.dh p{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--card);border-radius:22px;padding:20px}
.st span{color:var(--mute);font-size:14px}.st b{display:block;font-size:30px;letter-spacing:-.03em;margin-top:2px}.st small{font-size:13px;color:var(--ok)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.pn{background:var(--card);border-radius:22px;padding:22px;margin-bottom:16px;overflow:auto}
.pn h4{font-size:18px;margin-bottom:12px;letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;font-size:15px}
th{color:var(--mute);font-weight:500;text-align:left;padding:8px 10px;font-size:13px}
td{padding:12px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:980px;font-size:13px;font-weight:500;background:var(--soft)}
.t-New{background:#e5484d22;color:var(--bad)}.t-Confirmed{background:#0071e322;color:var(--blue)}.t-Shot{background:#f59e0b22;color:var(--warn)}.t-Editing{background:#bf5af222;color:#bf5af2}.t-Delivered{background:#30a14e22;color:var(--ok)}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:12px}.li:first-of-type{border-top:0}
.li small{color:var(--mute);display:block}
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:6px}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#0a84ff,#bf5af2);min-height:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{font-size:12px;color:var(--mute);text-align:center}
.cal .dy{min-height:76px;border-radius:12px;background:var(--soft);padding:6px;font-size:12px;overflow:hidden}
.cal .dy.td{outline:2px solid var(--blue)}.cal .dy em{display:block;font-style:normal;background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.gc{background:var(--card);border-radius:22px;overflow:hidden}
.gc .cv{height:130px}.gc .bd{padding:16px}
.pg{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.pg i{display:block;height:100%;background:var(--ok)}
.fm{display:grid;gap:12px;max-width:460px}
.tabs{display:none}
@media(max-width:800px){
 #app{grid-template-columns:1fr}aside{display:none}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .tabs a{font-size:11px;text-align:center;color:var(--mute);text-decoration:none;padding:4px 6px;cursor:pointer}.tabs a b{display:block;font-size:20px;font-weight:400}.tabs a.on{color:var(--blue)}
 .dh h2{font-size:28px}
 .st{padding:16px}.st b{font-size:24px}.toast{bottom:84px}
}
</style>
</head>
<body>

<div id="auth" class="hide"></div>

<!-- ============ DASHBOARD ============ -->
<div id="app" class="hide">
<aside id="side"></aside>
<main class="d" id="view"></main>
<nav class="tabs" id="tabs"></nav>
</div>

<div id="layer"></div>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var inr=function(n){return '₹'+Number(n||0).toLocaleString('en-IN')};
var store={get:function(k,d){try{var v=localStorage.getItem('shivay_'+k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem('shivay_'+k,JSON.stringify(v))}catch(e){}}};
var mem={};
function get(k,d){return k in mem?mem[k]:(mem[k]=store.get(k,d))}
function set(k,v){mem[k]=v;store.set(k,v)}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function off(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
var STATUS=['New','Confirmed','Shot','Editing','Delivered'],TYPES=['Wedding','Pre-wedding','Birthday / Event','Portrait','Product / Business','Film / Ad'];

function seed(){return {
 bookings:[
  {id:1,client:'Pooja & Rahul',phone:'98290 11111',type:'Wedding',date:off(6),place:'Udaipur',amount:85000,paid:30000,status:'Confirmed'},
  {id:2,client:'Mahendra Singh',phone:'94140 22222',type:'Birthday / Event',date:off(2),place:'Ranivara',amount:12000,paid:5000,status:'Confirmed'},
  {id:3,client:'Shree Textiles',phone:'99280 33333',type:'Product / Business',date:off(11),place:'Jalore',amount:24000,paid:0,status:'New'},
  {id:4,client:'Kavita Joshi',phone:'98870 44444',type:'Pre-wedding',date:off(-3),place:'Mount Abu',amount:35000,paid:35000,status:'Editing',photos:420},
  {id:5,client:'Rakesh Meena',phone:'90010 55555',type:'Wedding',date:off(-14),place:'Sirohi',amount:70000,paid:70000,status:'Delivered',photos:1180},
  {id:6,client:'Anita Devi',phone:'87690 66666',type:'Portrait',date:off(-26),place:'Ranivara',amount:6000,paid:6000,status:'Delivered',photos:96},
  {id:7,client:'Dinesh & Sunita',phone:'98280 77777',type:'Film / Ad',date:off(18),place:'Jodhpur',amount:55000,paid:15000,status:'Confirmed'},
  {id:8,client:'Hotel Rajwada',phone:'94620 88888',type:'Product / Business',date:off(-40),place:'Bhinmal',amount:40000,paid:40000,status:'Delivered',photos:260},
  {id:9,client:'Nisha Rathore',phone:'96360 99999',type:'Portrait',date:off(-8),place:'Jalore',amount:8000,paid:8000,status:'Shot'}
 ],next:10,studio:{name:'Shivay Studio',phone:'+91 83026 15834',place:'Ranivara, Rajasthan'}}}
function db(){var d=get('db',null);if(!d){d=seed();set('db',d)}return d}
function save(){set('db',db())}

var grd=function(h){return 'linear-gradient(135deg,hsl('+h+',85%,62%),hsl('+(h+55)+',80%,42%))'};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLayer()});
function closeLayer(){$('#layer').innerHTML='';$('#layer').onclick=null}

/* ---------- toast ---------- */
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2400)}

/* ---------- auth ---------- */
var DEMO={email:'demo@shivaystudio.in',pw:'demo1234'};
function authed(){return get('session',false)}
function loginScreen(){
 $('#auth').innerHTML='<div class="modal" role="main"><img class="icon" src="/apple-touch-icon.png" alt="Shivay Studio"><h3>Studio login</h3><p class="mute c">Bookings, clients, galleries and payments.</p>'
 +'<button class="btn" id="oneClick">✨ One-click demo login</button><div class="or">or sign in</div>'
 +'<form id="lf"><input class="in" id="em" type="email" placeholder="Email" value="'+DEMO.email+'" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Password" value="'+DEMO.pw+'" autocomplete="current-password"><p class="err" id="er"></p><button class="btn o" type="submit">Sign in</button></form>'
 +'<p class="mute" style="margin:14px 0 0;font-size:13px;text-align:center">Demo only — data stays in this browser.<br>Demo: '+DEMO.email+' / '+DEMO.pw+'</p><a class="back" href="/">← Back to website</a></div>';
 $('#oneClick').onclick=function(){login()};
 $('#lf').onsubmit=function(e){e.preventDefault();if($('#em').value.trim().toLowerCase()===DEMO.email&&$('#pw').value===DEMO.pw)login();else $('#er').textContent='Wrong email or password.'};
}
function login(){set('session',true);location.hash='#/overview';route();toast('Welcome back 👋')}
function logout(){set('session',false);location.hash='';route()}

/* ---------- router ---------- */
var VIEWS=[['overview','Overview','◉'],['bookings','Bookings','▤'],['calendar','Calendar','▦'],['galleries','Galleries','▣'],['clients','Clients','☺'],['invoices','Invoices','₹'],['settings','Settings','⚙']];
var calOff=0;
function route(){
 if(!authed()){$('#app').classList.add('hide');$('#auth').classList.remove('hide');loginScreen();return}
 var v=(location.hash||'').replace(/^#\/?/,'').split('/')[0]||'overview';if(!VIEWS.some(function(x){return x[0]===v}))v='overview';
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');dash(v);window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- dashboard ---------- */
function dash(v){
 var d=db();
 var link=function(x,on){return '<a class="nv'+(on?' on':'')+'" href="#/'+x[0]+'"><span style="width:20px;text-align:center">'+x[2]+'</span>'+x[1]+'</a>'};
 $('#side').innerHTML='<div class="brand"><img src="/logo.svg" alt="" width="28" height="28">'+esc(d.studio.name)+'</div>'+VIEWS.map(function(x){return link(x,x[0]===v)}).join('')+'<div class="sp"></div><a class="nv" href="/">↗ View website</a><a class="nv" id="lo">⎋ Log out</a>';
 $('#tabs').innerHTML=VIEWS.filter(function(x){return ['overview','bookings','calendar','galleries','settings'].indexOf(x[0])>-1}).map(function(x){return '<a href="#/'+x[0]+'" class="'+(x[0]===v?'on':'')+'"><b>'+x[2]+'</b>'+x[1]+'</a>'}).join('');
 $('#lo').onclick=logout;
 var f={overview:vOverview,bookings:vBookings,calendar:vCalendar,galleries:vGalleries,clients:vClients,invoices:vInvoices,settings:vSettings}[v];
 $('#view').innerHTML=f(d);
 bindView(v,d);
}
function hdr(t,sub,btn){return '<div class="dh"><div><h2>'+t+'</h2><p>'+sub+'</p></div>'+(btn||'')+'</div>'}
function monthKey(s){return s.slice(0,7)}
function vOverview(d){
 var b=d.bookings,mk=iso(new Date()).slice(0,7);
 var rev=b.filter(function(x){return monthKey(x.date)===mk}).reduce(function(a,x){return a+x.paid},0);
 var pend=b.reduce(function(a,x){return a+(x.amount-x.paid)},0);
 var up=b.filter(function(x){return x.date>=off(0)&&x.status!=='Delivered'}).sort(function(a,c){return a.date<c.date?-1:1});
 var nw=b.filter(function(x){return x.status==='New'});
 var months=[],now=new Date();for(var i=5;i>=0;i--){var m=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:iso(m).slice(0,7),l:m.toLocaleString('en',{month:'short'}),v:0})}
 b.forEach(function(x){months.forEach(function(m){if(m.k===monthKey(x.date))m.v+=x.paid})});
 var mx=Math.max.apply(null,months.map(function(m){return m.v}).concat([1]));
 return hdr('Good day, '+esc(d.studio.name.split(' ')[0]),new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}),'<button class="btn sm" data-new>+ New booking</button>')
 +'<div class="stats"><div class="st"><span>Collected this month</span><b>'+inr(rev)+'</b></div><div class="st"><span>Pending payments</span><b>'+inr(pend)+'</b></div><div class="st"><span>Upcoming shoots</span><b>'+up.length+'</b></div><div class="st"><span>New enquiries</span><b>'+nw.length+'</b></div></div>'
 +'<div class="two"><div class="pn"><h4>Revenue — last 6 months</h4><div class="bars">'+months.map(function(m){return '<div><span>'+(m.v?'₹'+Math.round(m.v/1000)+'k':'')+'</span><i style="height:'+Math.max(3,m.v/mx*100)+'%"></i>'+m.l+'</div>'}).join('')+'</div></div>'
 +'<div class="pn"><h4>Next shoots</h4>'+(up.slice(0,5).map(function(x){return '<div class="li"><div><b>'+esc(x.client)+'</b><small>'+esc(x.type)+' · '+esc(x.place)+'</small></div><span class="tag">'+fd(x.date)+'</span></div>'}).join('')||'<p style="color:var(--mute)">No upcoming shoots.</p>')+'</div></div>'
 +'<div class="pn"><h4>New enquiries from website</h4>'+(nw.map(function(x){return '<div class="li"><div><b>'+esc(x.client)+'</b><small>'+esc(x.type)+' · '+fd(x.date)+' · '+esc(x.phone)+'</small></div><div><button class="btn sm" data-ok="'+x.id+'">Confirm</button> <a class="btn sm g" href="https://wa.me/91'+esc(x.phone.replace(/\D/g,'').slice(-10))+'" target="_blank" rel="noopener">WhatsApp</a></div></div>'}).join('')||'<p style="color:var(--mute)">All caught up ✓</p>')+'</div>';
}
function fd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function vBookings(d){
 var rows=d.bookings.slice().sort(function(a,c){return a.date<c.date?1:-1}).map(function(x){return '<tr><td><b>'+esc(x.client)+'</b><br><small style="color:var(--mute)">'+esc(x.phone)+'</small></td><td>'+esc(x.type)+'</td><td>'+fd(x.date)+'</td><td>'+esc(x.place)+'</td><td>'+inr(x.amount)+'<br><small style="color:'+(x.paid>=x.amount?'var(--ok)':'var(--warn)')+'">'+(x.paid>=x.amount?'Paid':inr(x.amount-x.paid)+' due')+'</small></td><td><select class="in" style="padding:6px 10px;width:auto" data-st="'+x.id+'">'+STATUS.map(function(s){return '<option'+(s===x.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td><button class="btn sm r" data-del="'+x.id+'" aria-label="Delete">✕</button></td></tr>'}).join('');
 return hdr('Bookings',d.bookings.length+' total','<button class="btn sm" data-new>+ New booking</button>')+'<div class="pn"><table><thead><tr><th>Client</th><th>Type</th><th>Date</th><th>Place</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function vCalendar(d){
 var now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+calOff,1),first=m.getDay(),days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),cells='';
 ['S','M','T','W','T','F','S'].forEach(function(x){cells+='<div class="hd">'+x+'</div>'});
 for(var i=0;i<first;i++)cells+='<div></div>';
 for(var k=1;k<=days;k++){var ds=iso(new Date(m.getFullYear(),m.getMonth(),k));var ev=d.bookings.filter(function(x){return x.date===ds});cells+='<div class="dy'+(ds===off(0)?' td':'')+'">'+k+ev.map(function(x){return '<em>'+esc(x.client)+'</em>'}).join('')+'</div>'}
 return hdr('Calendar',m.toLocaleString('en',{month:'long',year:'numeric'}),'<div><button class="btn sm g" data-cal="-1">‹</button> <button class="btn sm g" data-cal="0">Today</button> <button class="btn sm g" data-cal="1">›</button></div>')+'<div class="pn"><div class="cal">'+cells+'</div></div>';
}
function vGalleries(d){
 var g=d.bookings.filter(function(x){return x.status==='Editing'||x.status==='Delivered'||x.status==='Shot'});
 return hdr('Client galleries','Share proofs and final photos with one link','')+'<div class="gal">'+g.map(function(x,i){var done=x.status==='Delivered',pct=done?100:x.status==='Editing'?60:25;return '<div class="gc"><div class="cv" style="background:'+grd((x.id*47)%360)+'"></div><div class="bd"><b>'+esc(x.client)+'</b><br><small style="color:var(--mute)">'+esc(x.type)+' · '+(x.photos||'—')+' photos</small><div class="pg"><i style="width:'+pct+'%"></i></div><span class="tag t-'+x.status+'">'+x.status+'</span> <button class="btn sm g" data-link="'+x.id+'" style="float:right">Copy link</button></div></div>'}).join('')+'</div>';
}
function clients(d){var m={};d.bookings.forEach(function(x){var c=m[x.client]||(m[x.client]={name:x.client,phone:x.phone,n:0,total:0,paid:0,last:''});c.n++;c.total+=x.amount;c.paid+=x.paid;if(x.date>c.last)c.last=x.date});return Object.keys(m).map(function(k){return m[k]})}
function vClients(d){
 return hdr('Clients',clients(d).length+' people','')+'<div class="pn">'+clients(d).map(function(c){return '<div class="li"><div><b>'+esc(c.name)+'</b><small>'+esc(c.phone)+' · '+c.n+' shoot'+(c.n>1?'s':'')+' · last '+fd(c.last)+'</small></div><div style="text-align:right"><b>'+inr(c.total)+'</b><small>'+(c.total>c.paid?inr(c.total-c.paid)+' due':'all paid')+'</small></div></div>'}).join('')+'</div>';
}
function vInvoices(d){
 var rows=d.bookings.slice().sort(function(a,c){return a.date<c.date?1:-1}).map(function(x){var paid=x.paid>=x.amount;return '<tr><td>INV-'+(1000+x.id)+'</td><td>'+esc(x.client)+'</td><td>'+fd(x.date)+'</td><td>'+inr(x.amount)+'</td><td>'+inr(x.paid)+'</td><td><span class="tag '+(paid?'t-Delivered':'t-Shot')+'">'+(paid?'Paid':'Due')+'</span></td><td>'+(paid?'':'<button class="btn sm" data-pay="'+x.id+'">Mark paid</button>')+'</td></tr>'}).join('');
 return hdr('Invoices','Track payments','')+'<div class="pn"><table><thead><tr><th>No.</th><th>Client</th><th>Date</th><th>Total</th><th>Received</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function vSettings(d){
 return hdr('Settings','Studio details','')+'<div class="pn"><form class="fm" id="sf"><label>Studio name<input class="in" name="name" value="'+esc(d.studio.name)+'"></label><label>Phone<input class="in" name="phone" value="'+esc(d.studio.phone)+'"></label><label>Location<input class="in" name="place" value="'+esc(d.studio.place)+'"></label><button class="btn" type="submit">Save</button></form></div><div class="pn"><h4>Demo data</h4><p style="color:var(--mute);margin-bottom:12px">Everything here is stored only in this browser.</p><button class="btn r sm" id="reset">Reset demo data</button></div>';
}
function newModal(){
 $('#layer').innerHTML='<div class="ov" data-close><div class="modal"><h3>New booking</h3><p class="mute">Add a shoot to your calendar.</p><form id="nf"><input class="in" name="client" placeholder="Client name" required><input class="in" name="phone" placeholder="Phone" required><select class="in" name="type">'+TYPES.map(function(t){return '<option>'+t+'</option>'}).join('')+'</select><input class="in" type="date" name="date" value="'+off(7)+'" required><input class="in" name="place" placeholder="Location"><input class="in" type="number" min="0" name="amount" placeholder="Amount ₹" required><button class="btn" type="submit">Add booking</button></form></div></div>';
 $('#layer').onclick=function(e){if(e.target.hasAttribute('data-close'))closeLayer()};
 $('#nf').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),d=db();d.bookings.push({id:d.next++,client:f.get('client'),phone:f.get('phone'),type:f.get('type'),date:f.get('date'),place:f.get('place'),amount:+f.get('amount')||0,paid:0,status:'Confirmed'});save();closeLayer();route();toast('Booking added')};
}
function bindView(v,d){
 $$('[data-new]').forEach(function(b){b.onclick=newModal});
 $$('[data-ok]').forEach(function(b){b.onclick=function(){find(b.getAttribute('data-ok')).status='Confirmed';save();route();toast('Confirmed')}});
 $$('[data-st]').forEach(function(s){s.onchange=function(){find(s.getAttribute('data-st')).status=s.value;save();toast('Status updated')}});
 $$('[data-del]').forEach(function(b){b.onclick=function(){if(confirm('Delete this booking?')){var d=db();d.bookings=d.bookings.filter(function(x){return x.id!=b.getAttribute('data-del')});save();route()}}});
 $$('[data-pay]').forEach(function(b){b.onclick=function(){var x=find(b.getAttribute('data-pay'));x.paid=x.amount;save();route();toast('Payment recorded')}});
 $$('[data-cal]').forEach(function(b){b.onclick=function(){var n=+b.getAttribute('data-cal');calOff=n?calOff+n:0;route()}});
 $$('[data-link]').forEach(function(b){b.onclick=function(){var t='https://shivay.studio/g/'+(1000+ +b.getAttribute('data-link'));try{navigator.clipboard.writeText(t)}catch(e){}toast('Link copied (demo)')}});
 var sf=$('#sf');if(sf)sf.onsubmit=function(e){e.preventDefault();var f=new FormData(sf),d=db();d.studio={name:f.get('name'),phone:f.get('phone'),place:f.get('place')};save();route();toast('Saved')};
 var rs=$('#reset');if(rs)rs.onclick=function(){if(confirm('Reset all demo data?')){set('db',seed());route();toast('Demo data reset')}};
}
function find(id){return db().bookings.filter(function(x){return x.id==id})[0]}

route();
})();
</script>
</body>
